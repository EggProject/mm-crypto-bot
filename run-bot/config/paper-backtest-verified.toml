# Backtest-aligned paper/emulated profile.
# This profile is not a return promise and does not authorize live trading.
# Public market data is WebSocket-first where CCXT Pro supports it, with REST
# fallback permitted. A future separately authorized live path must verify
# exactly selected 10x leverage before every Bybit EU Spot Margin order.

[bot]
mode = "paper"
log_level = "info"
state_file = "data/bot-state.json"
selected_leverage = "10"

# ======================================================================
# 2) EXCHANGE — fixed Bybit EU adapter settings
# Paper módban a publikus piaci adat WebSocket-first; a megbízás-végrehajtás emulált.
# Az adapter a hivatalos Bybit EU REST és WebSocket végpontokat választja.
# ======================================================================
[exchange]
id = "bybiteu"
timeout_ms = 5000
rate_limit_ms = 80
slippage_pct = 0.03
fee_tier = "vip"
rate_limit_per_min = 200
ws_reconnect_delay_ms = 500

# ======================================================================
# 2.5) COMPLIANCE — EU joghatóság
# ======================================================================
[compliance]
jurisdiction = "EU"

# ======================================================================
# 3) RISK — projekt-szintű kockázati limitek
# ======================================================================
[risk]
risk_per_trade = 0.01
kelly_fraction = 0.25
max_drawdown_pct = 0.15
max_positions = 3
max_leverage = 10

# ======================================================================
# 4) SYMBOLS
# ======================================================================
[symbols]
enabled = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]

# ======================================================================
# 5) STRATEGIES
# ======================================================================
[strategies.donchian_pivot_composition]
enabled = true
cap = 0.20
min_consensus = 1   # Phase 30b backtest: 11048 trades, 64.74% win, +34.41%/mo
symbols = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]

[strategies.dydx_cex_carry]
enabled = false
cap = 0.025
notional_per_leg_usd = 125000

[strategies.cascade_fade]
enabled = false
max_notional_per_event_usd = 1000000
cooldown_hours = 24

[strategies.funding_flip_kill_switch]
enabled = false

[strategies.regime_detector]
enabled = false

# ======================================================================
# 6) TELEMETRY
# ======================================================================
[telemetry]
log_dir = "logs/bot"
metrics_interval_sec = 60
log_level = "info"
log_destination = "both"
metrics_enabled = true
heartbeat_interval_sec = 30

# ======================================================================
# 7) PORTFOLIO
# ======================================================================
[portfolio]
total_risk_per_cycle_usd = 100
correlation_penalty_threshold = 0.7
correlation_window_size = 30
max_dd_pct = 0.10
