# Default paper configuration for mm-crypto-bot.
#
# This template is intentionally paper-only. It may consume public Bybit EU
# market data through the adapter's WebSocket-first feed, but all execution is
# emulated. It is not an authorization to deploy capital or activate live
# trading.

[bot]
mode = "paper"
log_level = "info"
state_file = "data/bot-state.json"
selected_leverage = "10"

[exchange]
id = "bybiteu"
timeout_ms = 5000
rate_limit_ms = 80
slippage_pct = 0.03
fee_tier = "vip"
rate_limit_per_min = 200
ws_reconnect_delay_ms = 500

[compliance]
jurisdiction = "EU"
jp_msb_registered = false

[risk]
risk_per_trade = 0.01
kelly_fraction = 0.25
max_drawdown_pct = 0.15
max_positions = 3
max_leverage = 10
max_position_fraction = 0.1
fallback_size_fraction = 0.01

[risk.trailing_stop]
enabled = false
atr_period = 14
atr_multiplier = 3
side = "both"

[risk.kelly]
enabled = false
fraction = 0.25
window_size = 50
min_trades = 10
fallback_fraction = 0.01

[risk.drawdown_scaler]
enabled = false
max_dd_pct = 0.15

[symbols]
enabled = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]

[strategies.donchian_pivot_composition]
enabled = true
cap = 0.2
min_consensus = 2
symbols = ["BTC/USDC", "ETH/USDC", "SOL/USDC"]

[strategies.dydx_cex_carry]
enabled = false
cap = 0.025
notional_per_leg_usd = 125000

[strategies.cascade_fade]
enabled = false
max_notional_per_event_usd = 1000000
cooldown_hours = 24

[strategies.funding_flip_kill_switch]
enabled = false

[strategies.regime_detector]
enabled = false

[telemetry]
log_dir = "logs/bot"
metrics_interval_sec = 60
log_level = "info"
log_destination = "both"
metrics_enabled = true
heartbeat_interval_sec = 30

[portfolio]
total_risk_per_cycle_usd = 100
correlation_penalty_threshold = 0.7
correlation_window_size = 30
max_dd_pct = 0.1
