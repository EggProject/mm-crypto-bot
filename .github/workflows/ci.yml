name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-no-warnings:
    name: Install (no-warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: bun install must produce zero warnings (no nested overrides)
        run: bun run test:install-warnings

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Run tests (with JUnit XML reporter)
        run: bunx turbo run test -- --reporter=junit --reporter-outfile=./junit.xml
      - name: Upload JUnit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-reports
          path: '**/junit.xml'
          if-no-files-found: warn
          retention-days: 30
      - name: Publish test results to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: dorny/test-reporter@v1
        with:
          name: bun-test-results
          path: '**/junit.xml'
          reporter: java-junit
          fail-on-error: false
          only-summary: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Select fail-closed coverage comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            echo "Unsupported coverage event: $EVENT_NAME" >&2
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "Coverage comparison base is missing or invalid" >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          echo "MM_BOT_COVERAGE_BASE=$base_sha" >> "$GITHUB_ENV"
      - name: Coverage infrastructure regression tests
        run: bun run test:coverage-infra
      - name: Fresh strict coverage pipeline
        run: bun run coverage:full
      - name: Upload separate unit and subprocess E2E reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/bot/coverage/unit/coverage-summary.json
            apps/bot/coverage/unit/lcov.info
            apps/bot/coverage/e2e/summary.json
            apps/bot/coverage/e2e/raw/*.json
            packages/*/coverage/lcov.info
            coverage/merged/lcov.info
          if-no-files-found: warn
          retention-days: 30
